spring:
  application:
    name: tinker
  main:
    # The REPL prints its own banner; Spring's would just be noise.
    banner-mode: "off"

tinker:
  providers:
    google:
      baseUrl: "https://googleapis.com"
      apiKey: "${GEMINI_API_KEY:}"
    openrouter:
      baseUrl: "https://openrouter.ai"
      apiKey: "${OPENROUTER_API_KEY:}"