spring:
  application:
    name: tinker
  shell:
    # Spring Shell owns the interactive JLine loop now. Its own LineReader
    # handles bracketed paste natively, so no custom Parser is needed.
    interactive:
      enabled: true
    command:
      script:
        enabled: false

tinker:
  providers:
    google:
      baseUrl: "https://googleapis.com"
      apiKey: "${GEMINI_API_KEY:}"
    openrouter:
      baseUrl: "https://openrouter.ai"
      apiKey: "${OPENROUTER_API_KEY:}"